<div class="p-4 bg-white rounded-lg shadow-sm">
  @let p = product();
  <h4>{{ p.name }}</h4>
  <p>{{ p.description }}</p>
  <p>{{ p.price }}</p>
  <p>Average price: {{ averagePrice() }}</p>
  <button type="button" mat-icon-button (click)="remove.emit(p.id)">
    <mat-icon>delete</mat-icon>
  </button>
</div>
