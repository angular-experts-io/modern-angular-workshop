<my-org-card [active]="rlaDetail.isActive || rlaEdit.isActive">
  <div class="mr-auto flex flex-col gap-2">
    @let p = product();
    <h4>{{ p.name }}</h4>
    <span>{{ p.description }}</span>
    <div class="flex flex-wrap gap-4 mt-4">
      <my-org-chip icon="attach_money">
        {{ p.price }}
      </my-org-chip>
      <my-org-chip icon="avg_time">
        {{ averagePrice() }}
      </my-org-chip>
      <my-org-chip icon="warehouse">
        {{ p.quantity }}
      </my-org-chip>
    </div>
    <div class="flex flex-wrap gap-4 mt-2">
      <my-org-chip icon="category">
        {{ p.category }}
      </my-org-chip>
      <my-org-chip icon="store">
        {{ p.supplier.name }}
      </my-org-chip>
      <my-org-chip icon="location_on">
        {{ p.supplier.origin }}
      </my-org-chip>
    </div>
  </div>
  <div class="flex items-center">
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      [color]="rlaDetail.isActive ? 'primary' : ''"
      [routerLink]="[p.id]"
      routerLinkActive
      #rlaDetail="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>visibility</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      [color]="rlaEdit.isActive ? 'primary' : ''"
      [routerLink]="['editor', p.id]"
      routerLinkActive
      #rlaEdit="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <mat-icon>edit</mat-icon>
    </button>
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled()"
      (click)="remove.emit(product())"
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</my-org-card>
